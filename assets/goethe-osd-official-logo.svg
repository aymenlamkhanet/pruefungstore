<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70">
  <!-- Goethe-Institut Green Square Badge -->
  <g transform="translate(6, 8)">
    <rect width="54" height="54" rx="10" fill="#84B817" />
    <!-- White Geometric 'G' Monogram -->
    <path d="M 38 18 L 22 18 C 16.5 18 13 21.5 13 27 L 13 43 C 13 48.5 16.5 52 22 52 L 38 52 C 43.5 52 47 48.5 47 43 L 47 33 L 28 33 L 28 38 L 41 38 L 41 43 C 41 45.5 39.5 47 37 47 L 23 47 C 20.5 47 19 45.5 19 43 L 19 27 C 19 24.5 20.5 23 23 23 L 37 23 C 39.5 23 41 24.5 41 27 L 47 27 C 47 21.5 43.5 18 38 18 Z" fill="#FFFFFF" transform="scale(0.85) translate(4, 3)" />
  </g>
  
  <!-- GOETHE-INSTITUT Typography -->
  <g transform="translate(68, 14)">
    <text x="0" y="16" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="900" fill="#0F172A" letter-spacing="0.8">GOETHE</text>
    <text x="0" y="30" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="800" fill="#84B817" letter-spacing="1.2">INSTITUT</text>
  </g>

  <!-- Divider -->
  <line x1="158" y1="12" x2="158" y2="58" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- ÖSD Emblem (Österreichisches Sprachdiplom) -->
  <g transform="translate(170, 14)">
    <!-- Red/White/Red Austrian Mini-Shield Accent -->
    <rect x="0" y="4" width="22" height="15" rx="3" fill="#ED2939" />
    <rect x="0" y="9" width="22" height="5" fill="#FFFFFF" />
    <!-- ÖSD Wordmark -->
    <text x="28" y="16" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="900" fill="#003B7E" letter-spacing="1">ÖSD</text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#64748B" letter-spacing="0.3">ZERTIFIKAT</text>
  </g>
</svg>