services:
  - type: web
    name: pruefungstore-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    branch: master
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.11.1
      - key: PORT
        value: "4000"
      - key: DB_PATH
        value: /app/data/pruefungstore.db
      - key: UPLOADS_DIR
        value: /app/data/uploads
      - key: WHATSAPP_NUMBER
        value: "212621740209"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://pruefungstore-frontend.onrender.com
  - type: web
    name: pruefungstore-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    branch: master
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://pruefungstore-backend.onrender.com
