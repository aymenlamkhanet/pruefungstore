services:
  - type: web
    name: pruefungstore-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    branch: master
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.11.1
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: PORT
        value: "4000"
      - key: DB_PATH
        value: /app/data/pruefungstore.db
      - key: UPLOADS_DIR
        value: /app/data/uploads
      - key: WHATSAPP_NUMBER
        value: "212632017446"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin2026
      - key: ADMIN_TOKEN
        value: admin-2026
      - key: FRONTEND_ORIGIN
        value: https://www.storedeutsch.com,https://storedeutsch.com,https://pruefungstore-frontend.onrender.com
  - type: web
    name: pruefungstore-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    branch: master
    autoDeploy: true
    domains:
      - storedeutsch.com
      - www.storedeutsch.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: BACKEND_URL
        value: https://pruefungstore-backend-261a.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://pruefungstore-backend-261a.onrender.com/api
