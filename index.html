<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrüfungStore — L'Excellence des Examens d'Allemand B1 & B2</title>
  
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>

  // Initialisation dynamique des Reels Vidéo avec Autoplay et Contrôles du Screenshot
  function initReelAutoplay() {
    const reelCards = document.querySelectorAll('.reel-video-card');
    reelCards.forEach((card) => {
      const video = card.querySelector('video');
      const playBtn = card.querySelector('.reel-play-toggle');
      const muteBtn = card.querySelector('.reel-mute-toggle');
      const timeDisplay = card.querySelector('.reel-time-display');
      const progressBar = card.querySelector('.reel-progress-fill');
      const centerPlayGlow = card.querySelector('.play-button-glow');

      if (!video) return;

      // Autoplay fiable au scroll avec IntersectionObserver
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            video.play().catch(() => {});
          } else {
            video.pause();
          }
        });
      }, { threshold: 0.15 });
      observer.observe(card);

      // Mise à jour fluide du curseur et du timecode
      video.addEventListener('timeupdate', () => {
        if (progressBar && video.duration) {
          const pct = (video.currentTime / video.duration) * 100;
          progressBar.style.width = `${pct}%`;
        }
        if (timeDisplay && video.duration) {
          const curM = Math.floor(video.currentTime / 60);
          const curS = Math.floor(video.currentTime % 60).toString().padStart(2, '0');
          const durM = Math.floor(video.duration / 60);
          const durS = Math.floor(video.duration % 60).toString().padStart(2, '0');
          timeDisplay.textContent = `${curM}:${curS} / ${durM}:${durS}`;
        }
      });

      // Basculer Lecture / Pause
      const togglePlay = (e) => {
        if (e) e.stopPropagation();
        if (video.paused) {
          video.play();
          if (centerPlayGlow) centerPlayGlow.style.opacity = '0';
          if (playBtn) playBtn.innerHTML = '<i data-lucide="pause" class="w-3.5 h-3.5 fill-current"></i>';
        } else {
          video.pause();
          if (centerPlayGlow) centerPlayGlow.style.opacity = '1';
          if (playBtn) playBtn.innerHTML = '<i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>';
        }
        if (window.lucide) window.lucide.createIcons();
      };

      if (playBtn) playBtn.addEventListener('click', togglePlay);
      if (centerPlayGlow) centerPlayGlow.addEventListener('click', togglePlay);

      // Synchronisation état vidéo
      video.addEventListener('play', () => {
        if (centerPlayGlow) centerPlayGlow.style.opacity = '0';
        if (playBtn) playBtn.innerHTML = '<i data-lucide="pause" class="w-3.5 h-3.5 fill-current"></i>';
        if (window.lucide) window.lucide.createIcons();
      });

      video.addEventListener('pause', () => {
        if (centerPlayGlow) centerPlayGlow.style.opacity = '1';
        if (playBtn) playBtn.innerHTML = '<i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>';
        if (window.lucide) window.lucide.createIcons();
      });

      // Basculer Muet / Son
      if (muteBtn) {
        muteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          video.muted = !video.muted;
          if (video.muted) {
            muteBtn.innerHTML = '<i data-lucide="volume-x" class="w-3.5 h-3.5"></i>';
            muteBtn.title = "Activer le son";
          } else {
            muteBtn.innerHTML = '<i data-lucide="volume-2" class="w-3.5 h-3.5 text-emerald-400"></i>';
            muteBtn.title = "Couper le son";
          }
          if (window.lucide) window.lucide.createIcons();
        });
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    initReelAutoplay();
  });

</script>
</body>
</html>
