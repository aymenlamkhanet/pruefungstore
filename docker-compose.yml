version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: pruefungstore-backend
    environment:
      - PORT=4000
      - NODE_ENV=production
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin2026}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-this-admin-token}
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER:-212621740209}
      - DB_PATH=/app/data/pruefungstore.db
      - UPLOADS_DIR=/app/data/uploads
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
    volumes:
      - backend_data:/app/data
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    container_name: pruefungstore-frontend
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:4000
    ports:
      - "3000:10000"

volumes:
  backend_data:
