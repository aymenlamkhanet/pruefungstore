    function App() {
      // Theme State (Dark vs Light)
      const [theme, setTheme] = useState(() => {
        return localStorage.getItem("adminflow_theme") || "dark";
      });

      const [currentTab, setCurrentTab] = useState("overview");
      const [products, setProducts] = useState(() => {
        const local = localStorage.getItem("adminflow_products");
        return local ? JSON.parse(local) : INITIAL_PRODUCTS;
      });
      const [orders, setOrders] = useState(() => {
        const local = localStorage.getItem("adminflow_orders");
        return local ? JSON.parse(local) : INITIAL_ORDERS;
      });

      const [isProductModalOpen, setIsProductModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [isOrderModalOpen, setIsOrderModalOpen] = useState(false);
      const [selectedOrderDetails, setSelectedOrderDetails] = useState(null);
      const [toastMessage, setToastMessage] = useState("");
      const [globalSearch, setGlobalSearch] = useState("");

      // Apply theme class to <html>
      useEffect(() => {
        const root = document.documentElement;
        if (theme === "dark") {
          root.classList.add("dark");
        } else {
          root.classList.remove("dark");
        }
        localStorage.setItem("adminflow_theme", theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(t => (t === "dark" ? "light" : "dark"));
      };

      useEffect(() => {
        localStorage.setItem("adminflow_products", JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem("adminflow_orders", JSON.stringify(orders));
      }, [orders]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 3000);
      };

      // CRUD Products
      const handleSaveProduct = (prodData) => {
        if (editingProduct) {
          setProducts(products.map(p => p.id === editingProduct.id ? { ...p, ...prodData } : p));
          showToast("Produit modifié avec succès !");
        } else {
          const newId = "PRD-" + String(products.length + 1).padStart(3, '0');
          setProducts([{ id: newId, sales: 0, ...prodData }, ...products]);
          showToast("Nouveau produit ajouté au catalogue !");
        }
        setIsProductModalOpen(false);
        setEditingProduct(null);
      };

      const handleDeleteProduct = (id) => {
        if (confirm("Supprimer définitivement ce produit ?")) {
          setProducts(products.filter(p => p.id !== id));
          showToast("Produit supprimé.");
        }
      };

      const handleUpdateOrderStatus = (orderId, newStatus) => {
        setOrders(orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
        showToast("Statut de la commande mis à jour !");
      };

      const handleDeleteOrder = (orderId) => {
        if (confirm("Supprimer cette commande ?")) {
          setOrders(orders.filter(o => o.id !== orderId));
          showToast("Commande supprimée.");
        }
      };

      return (
        <div className="flex h-screen overflow-hidden bg-slate-50 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 transition-colors duration-200">
          
          {/* ================= 1. SIDEBAR ================= */}
          <aside className="w-64 bg-white dark:bg-[#0e1422] border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between hidden md:flex shrink-0 shadow-sm z-20 transition-colors duration-200">
            <div className="p-6 space-y-7">
              
              {/* Brand Logo */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-outfit font-black text-lg shadow-md shadow-blue-500/20">
                  AF
                </div>
                <div>
                  <span className="font-outfit font-black text-lg text-slate-900 dark:text-white tracking-tight block leading-tight">
                    Admin<span className="text-blue-600 dark:text-blue-400">Flow</span>
                  </span>
                  <span className="text-[10px] text-slate-400 dark:text-slate-500 font-bold uppercase tracking-wider block">Store Manager</span>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className="space-y-1.5">
                <NavItem icon="layout-dashboard" label="Vue d'ensemble" active={currentTab === "overview"} onClick={() => setCurrentTab("overview")} />
                <NavItem icon="package" label="Produits" count={products.length} active={currentTab === "products"} onClick={() => setCurrentTab("products")} />
                <NavItem icon="shopping-cart" label="Commandes" count={orders.filter(o => o.status === "pending" || o.status === "processing").length} active={currentTab === "orders"} onClick={() => setCurrentTab("orders")} badgeColor="bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400" />
                <NavItem icon="users" label="Clients" active={currentTab === "clients"} onClick={() => setCurrentTab("clients")} />
                <NavItem icon="settings" label="Paramètres" active={currentTab === "settings"} onClick={() => setCurrentTab("settings")} />
              </nav>

            </div>

            {/* Bottom Profile & Actions */}
            <div className="p-5 border-t border-slate-100 dark:border-slate-800/80 space-y-3">
              <a href="index.html" target="_blank" className="w-full py-2.5 px-3 rounded-xl bg-slate-50 dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold text-xs flex items-center justify-center gap-2 transition border border-slate-200 dark:border-slate-800">
                <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                <span>Voir la Boutique</span>
              </a>

              <div className="flex items-center gap-3 pt-1">
                <div className="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center font-bold text-xs text-blue-600 dark:text-blue-400">
                  SM
                </div>
                <div className="flex-1 min-w-0">
                  <h4 className="text-xs font-bold text-slate-800 dark:text-slate-200 truncate">Sarah Martin</h4>
                  <p className="text-[10px] text-slate-400 dark:text-slate-500 truncate">Administrateur</p>
                </div>
              </div>
            </div>
          </aside>

          {/* ================= 2. MAIN WORKSPACE ================= */}
          <div className="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            {/* Topbar Header */}
            <header className="h-16 bg-white/90 dark:bg-[#0e1422]/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-6 sm:px-8 flex items-center justify-between sticky top-0 z-10 transition-colors duration-200">
              
              {/* Search Bar */}
              <div className="relative w-64 sm:w-80">
                <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input 
                  type="text" 
                  value={globalSearch}
                  onChange={(e) => setGlobalSearch(e.target.value)}
                  placeholder="Recherche globale..." 
                  className="w-full pl-10 pr-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:bg-white dark:focus:bg-slate-950 transition"
                />
              </div>

              {/* Action Tools & Theme Switcher */}
              <div className="flex items-center gap-3">
                
                {/* ☀️ / 🌙 THEME TOGGLE BUTTON */}
                <button 
                  onClick={toggleTheme}
                  className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-amber-400 font-bold text-xs flex items-center gap-1.5 transition shadow-xs"
                  title={theme === 'dark' ? "Passer en Mode Clair" : "Passer en Mode Sombre"}
                >
                  {theme === "dark" ? (
                    <>
                      <i data-lucide="sun" className="w-4 h-4 text-amber-400"></i>
                      <span className="hidden sm:inline text-xs text-slate-300">Clair</span>
                    </>
                  ) : (
                    <>
                      <i data-lucide="moon" className="w-4 h-4 text-slate-700"></i>
                      <span className="hidden sm:inline text-xs text-slate-700">Sombre</span>
                    </>
                  )}
                </button>

                <button onClick={() => { setEditingProduct(null); setIsProductModalOpen(true); }} className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-sm shadow-blue-500/20 flex items-center gap-1.5 transition">
                  <i data-lucide="plus" className="w-4 h-4"></i>
                  <span className="hidden sm:inline">Ajouter Produit</span>
                </button>

                <div className="h-6 w-px bg-slate-200 dark:bg-slate-800 mx-1"></div>

                <div className="relative">
                  <button className="p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition relative">
                    <i data-lucide="bell" className="w-4 h-4"></i>
                    <span className="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-blue-600"></span>
                  </button>
                </div>
              </div>

            </header>

            {/* Dynamic Content Panels */}
            <main className="p-6 sm:p-8 max-w-7xl w-full mx-auto space-y-8 flex-1">
              
              {currentTab === "overview" && (
                <OverviewTab 
                  products={products} 
                  orders={orders} 
                  theme={theme}
                  onViewOrders={() => setCurrentTab("orders")}
                  onSelectOrder={(ord) => setSelectedOrderDetails(ord)}
                />
              )}

              {currentTab === "products" && (
                <ProductsTab 
                  products={products} 
                  globalSearch={globalSearch}
                  onAddProduct={() => { setEditingProduct(null); setIsProductModalOpen(true); }}
                  onEditProduct={(p) => { setEditingProduct(p); setIsProductModalOpen(true); }}
                  onDeleteProduct={handleDeleteProduct}
                />
              )}

              {currentTab === "orders" && (
                <OrdersTab 
                  orders={orders} 
                  globalSearch={globalSearch}
                  onUpdateStatus={handleUpdateOrderStatus}
                  onDeleteOrder={handleDeleteOrder}
                  onViewDetails={(ord) => setSelectedOrderDetails(ord)}
                  onNewOrder={() => setIsOrderModalOpen(true)}
                />
              )}

              {currentTab === "clients" && (
                <ClientsTab orders={orders} />
              )}

              {currentTab === "settings" && (
                <SettingsTab 
                  products={products} 
                  orders={orders} 
                  theme={theme}
                  onToggleTheme={toggleTheme}
                  onReset={() => {
                    setProducts(INITIAL_PRODUCTS);
                    setOrders(INITIAL_ORDERS);
                    showToast("Données réinitialisées aux valeurs par défaut !");
                  }}
                  showToast={showToast}
                />
              )}

            </main>

          </div>

          {/* ================= 3. MODALS ================= */}
          {isProductModalOpen && (
            <ProductModal 
              product={editingProduct} 
              onClose={() => { setIsProductModalOpen(false); setEditingProduct(null); }} 
              onSave={handleSaveProduct} 
            />
          )}

          {isOrderModalOpen && (
            <NewOrderModal 
              products={products} 
              onClose={() => setIsOrderModalOpen(false)} 
              onSave={(newOrd) => {
                setOrders([newOrd, ...orders]);
                setIsOrderModalOpen(false);
                showToast("Nouvelle commande créée !");
              }} 
            />
          )}

          {selectedOrderDetails && (
            <OrderDetailsModal 
              order={selectedOrderDetails} 
              onClose={() => setSelectedOrderDetails(null)} 
              onUpdateStatus={handleUpdateOrderStatus}
            />
          )}

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-5 py-3 rounded-2xl shadow-2xl font-bold text-xs flex items-center gap-2.5 animate-bounce">
              <i data-lucide="check-circle" className="w-4 h-4 text-emerald-500"></i>
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    function NavItem({ icon, label, count, active, onClick, badgeColor = "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400" }) {
      return (
        <button 
          onClick={onClick}

    function KpiCard({ title, value, trend, trendPositive, icon, color, subtitle, alert }) {
      const colors = {
        blue: "bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400",
        emerald: "bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400",
        purple: "bg-purple-50 dark:bg-purple-950/60 text-purple-600 dark:text-purple-400",
        amber: "bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400"
      };

      return (
        <div className={`bg-white dark:bg-[#0e1422] border ${alert ? 'border-amber-300 dark:border-amber-500/50 ring-2 ring-amber-100 dark:ring-amber-900/30' : 'border-slate-200 dark:border-slate-800'} rounded-2xl p-6 shadow-sm space-y-3`}>
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">{title}</span>
            <div className={`w-10 h-10 rounded-xl ${colors[color]} flex items-center justify-center font-bold`}>

          <div className="space-y-1">
            <div className="font-outfit font-black text-2xl text-slate-900 dark:text-white">{value}</div>

              <span className="text-slate-400 dark:text-slate-500 text-[11px]">{subtitle}</span>
              {trend && (
                <span className={`font-bold ${trendPositive ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-500'}`}>
                  {trend}
                </span>
              )}

      );

    // =========================================================================

    function ProductsTab({ products, globalSearch, onAddProduct, onEditProduct, onDeleteProduct }) {
      const [categoryFilter, setCategoryFilter] = useState("all");
      const [statusFilter, setStatusFilter] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 6;

      const categories = useMemo(() => {
        const set = new Set(products.map(p => p.category));
        return ["all", ...Array.from(set)];
      }, [products]);

      const filtered = useMemo(() => {
        return products.filter(p => {
          const q = (searchQuery || globalSearch).toLowerCase();
          const matchSearch = !q || p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
          const matchCat = categoryFilter === "all" || p.category === categoryFilter;
          const matchStatus = statusFilter === "all" || 
            (statusFilter === "in_stock" && p.stock > 10) ||
            (statusFilter === "low_stock" && p.stock > 0 && p.stock <= 10) ||
            (statusFilter === "out_of_stock" && p.stock === 0);
          return matchSearch && matchCat && matchStatus;
        });
      }, [products, categoryFilter, statusFilter, searchQuery, globalSearch]);

      const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
      const paginated = filtered.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

                <option value="all">Toutes Catégories</option>

                            <span className="text-[10px] text-slate-400">unités</span>
                          </div>
                        </td>
                        <td className="p-4">
                          {p.stock > 10 ? (
                            <span className="px-2.5 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800 font-bold text-[10px]">✓ En Stock</span>
                          ) : p.stock > 0 ? (
                            <span className="px-2.5 py-1 rounded-full bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 border border-amber-200 dark:border-amber-800 font-bold text-[10px]">⚠️ Faible ({p.stock})</span>
                          ) : (
                            <span className="px-2.5 py-1 rounded-full bg-red-50 dark:bg-red-950/60 text-red-700 dark:text-red-400 border border-red-200 dark:border-red-800 font-bold text-[10px]">✕ Rupture</span>

              </div>

    function ClientsTab({ orders }) {

              name: o.customer,
              email: o.email,
              phone: o.phone,
              city: o.city,

                <h3 className="font-outfit font-black text-lg text-slate-900 dark:text-white">Détails de la Commande</h3>
              </div>
              <button onClick={onClose} className="p-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <div className="space-y-4 text-xs">
              
              <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/80 border border-slate-200/80 dark:border-slate-800 space-y-2">
                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Coordonnées Client</span>
                <div className="font-bold text-slate-900 dark:text-white text-sm">{order.customer}</div>
                <div className="text-slate-600 dark:text-slate-400 font-medium">📞 {order.phone} • ✉️ {order.email}</div>
                <div className="text-slate-600 dark:text-slate-400">📍 {order.address}, <strong>{order.city}</strong></div>
              </div>

              <div className="space-y-2">
                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Articles Commandés</span>
                <div className="divide-y divide-slate-100 dark:divide-slate-800 border border-slate-100 dark:border-slate-800 rounded-xl overflow-hidden">
                  {order.items.map((it, idx) => (
                    <div key={idx} className="p-3 flex items-center justify-between bg-white dark:bg-slate-900/40">
                      <div>
                        <span className="font-bold text-slate-800 dark:text-slate-200">{it.name}</span>
                        <span className="text-slate-400 block text-[11px]">Quantité : {it.qty}</span>
                      </div>
                      <span className="font-bold text-slate-900 dark:text-white">{it.price * it.qty} DH</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex justify-between items-center p-3.5 rounded-xl bg-blue-50 dark:bg-blue-950/40 text-blue-900 dark:text-blue-300 font-bold">
                <span>Total à Encaisser (COD) :</span>
                <span className="font-outfit font-black text-lg text-blue-700 dark:text-blue-400">{order.total} DH</span>
              </div>

              <div className="pt-2 flex items-center justify-between">
                <label className="font-bold text-slate-700 dark:text-slate-300">Changer Statut :</label>
                <select 
                  value={order.status}
                  onChange={(e) => { onUpdateStatus(order.id, e.target.value); onClose(); }}
                  className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 font-bold bg-white dark:bg-slate-900 text-slate-800 dark:text-white focus:outline-none"
                >
                  <option value="pending">🟡 En attente</option>
                  <option value="processing">🔵 En cours</option>
                  <option value="shipped">🟣 Expédiée</option>
                  <option value="delivered">🟢 Livrée & Payée</option>
                  <option value="cancelled">🔴 Annulée</option>
                </select>
              </div>

            </div>

            <div className="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end">
              <button onClick={onClose} className="px-5 py-2.5 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold text-xs">
                Fermer
              </button>
            </div>

          </div>
        </div>
      );
    }

    function NewOrderModal({ products, onClose, onSave }) {
      const [customer, setCustomer] = useState("");
      const [phone, setPhone] = useState("");
      const [email, setEmail] = useState("");
      const [city, setCity] = useState("Casablanca");
      const [address, setAddress] = useState("");
      const [selectedProdId, setSelectedProdId] = useState(products[0]?.id || "");

      const handleSubmit = (e) => {
        e.preventDefault();
        const p = products.find(prod => prod.id === selectedProdId) || products[0];
        onSave({
          id: "CMD-" + Date.now().toString().slice(-6),
          customer,
          phone,
          email: email || "client@gmail.com",
          city,
          address,
          date: new Date().toISOString().replace('T', ' ').slice(0, 16),
          items: [{ id: p.id, name: p.name, qty: 1, price: p.price }],
          total: p.price,
          status: "pending",
          payment: "Paiement à la livraison (COD)"
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white dark:bg-[#121827] rounded-3xl max-w-md w-full border border-slate-200 dark:border-slate-700 p-6 sm:p-8 shadow-2xl space-y-5 text-slate-800 dark:text-slate-100">
            <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
              <h3 className="font-outfit font-black text-lg text-slate-900 dark:text-white">Nouvelle Commande Manuelle</h3>
              <button onClick={onClose} className="p-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">Nom du Client :</label>
                <input type="text" required value={customer} onChange={(e) => setCustomer(e.target.value)} placeholder="ex: Mohammed Alami" className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white font-bold focus:outline-none focus:border-blue-500" />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">Téléphone :</label>
                  <input type="text" required value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="+212 6..." className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white font-bold focus:outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">Ville :</label>
                  <input type="text" required value={city} onChange={(e) => setCity(e.target.value)} className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white font-bold focus:outline-none focus:border-blue-500" />
                </div>
              </div>

              <div>
                <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">Adresse de Livraison :</label>
                <input type="text" value={address} onChange={(e) => setAddress(e.target.value)} placeholder="Quartier, Rue, N°..." className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white focus:outline-none" />
              </div>

              <div>
                <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">Produit Commandé :</label>
                <select value={selectedProdId} onChange={(e) => setSelectedProdId(e.target.value)} className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white font-bold focus:outline-none">
                  {products.map(p => (
                    <option key={p.id} value={p.id}>{p.name} ({p.price} DH)</option>
                  ))}
                </select>
              </div>

              <div className="pt-3 flex items-center justify-end gap-2 border-t border-slate-100 dark:border-slate-800">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 font-bold">Annuler</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-md shadow-emerald-500/20">Créer</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function StatusBadge({ status }) {
      const map = {
        pending: { label: "🟡 En attente", cls: "bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 border-amber-200 dark:border-amber-900/60" },
        processing: { label: "🔵 En cours", cls: "bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-400 border-blue-200 dark:border-blue-900/60" },
        shipped: { label: "🟣 Expédiée", cls: "bg-purple-50 dark:bg-purple-950/60 text-purple-700 dark:text-purple-400 border-purple-200 dark:border-purple-900/60" },
        delivered: { label: "🟢 Livrée", cls: "bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400 border-emerald-200 dark:border-emerald-900/60" },
        cancelled: { label: "🔴 Annulée", cls: "bg-red-50 dark:bg-red-950/60 text-red-700 dark:text-red-400 border-red-200 dark:border-red-900/60" }
      };
      const st = map[status] || map.pending;
      return <span className={`px-2.5 py-0.5 rounded-full border text-[10px] font-bold ${st.cls}`}>{st.label}</span>;
    }

    // Render App
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
